<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palmwave Cover Studio — GTA-style cover art maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>PALMWAVE</h1>
      <p>Cover Studio — your photo, poster-star treatment</p>
    </div>
    <div class="exportbar">
      <div class="sizes" id="sizes" role="group" aria-label="Export size"></div>
      <button id="export" class="export-btn" type="button">Export PNG</button>
    </div>
  </header>
  <main class="workspace">
    <aside class="rail">
      <section>
        <h2>1 · Photos</h2>
        <label class="upload">Add your photos<input id="files" type="file" accept="image/*" multiple></label>
        <div id="thumbs" class="thumbs"></div>
        <p class="hint" id="photoHint"></p>
      </section>
      <section>
        <h2>2 · Fill &amp; framing</h2>
        <div class="seg" id="fillSeg">
          <button data-mode="panels" type="button">A photo per panel</button>
          <button data-mode="spread" type="button">One photo, all panels</button>
        </div>
        <label class="zoomrow">Zoom <input id="zoom" type="range" min="1" max="3.5" step="0.01" value="1"></label>
        <button id="resetFrame" class="ghost" type="button">Reset framing</button>
        <p class="hint">Click a panel on the cover to select it. Drag to move its photo, scroll to zoom.</p>
      </section>
      <section>
        <h2>3 · Layout</h2>
        <div id="layouts" class="choices"></div>
      </section>
      <section>
        <h2>4 · Colour grade</h2>
        <div id="grades" class="choices swatches"></div>
      </section>
      <section>
        <h2>5 · Caption</h2>
        <label>Title <input id="title" type="text" maxlength="42" value="Neon Coast"></label>
        <label>Smaller line <input id="sub" type="text" maxlength="60" value="Welcome to Palmwave"></label>
      </section>
      <p id="status" role="status"></p>
    </aside>
    <section class="stage">
      <canvas id="cover" width="864" height="1080" aria-label="Live preview of your cover"></canvas>
      <p class="stagehint">Live preview — the export renders at full size, ready to post.</p>
    </section>
  </main>
</div>
<script type="module" src="./src/studio.js"></script>
</body>
</html>
